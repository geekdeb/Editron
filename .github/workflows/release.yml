name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Editron ${{ github.ref_name }}'
          releaseBody: |
            ## Editron Release ${{ github.ref_name }} ⚡
            
            Welcome to **Editron** — the lightning-fast, privacy-first desktop text editor and developer swiss-army knife!
            
            ### 📥 Downloads
            
            Download the official Windows builds below:
            - **`Editron_1.0.0_x64-setup.exe`** — Standard Windows NSIS Setup Installer (Recommended)
            - **`Editron_1.0.0_x64_portable.zip`** — Standalone Portable Zip (Extract & run immediately)
            
            ### Highlights
            - ⚡ Instant native desktop startup and ultra-low RAM footprint
            - 📁 Native File Explorer with persistent state across restarts
            - 🛠 Developer toolbox (JSON/XML/YAML formatters, Base64, URL, JWT, Hashes, RegEx, Timestamps, Unicode)
            - 📝 Live split Markdown preview
            - 🎨 Cyber Dark & Frost Light themes
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Portable Executable
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $zipName = "Editron_${ver}_x64_portable.zip"
          Compress-Archive -Path "src-tauri/target/release/editron.exe" -DestinationPath "$zipName" -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Portable Zip to Release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: editron-windows-build-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            Editron_*_x64_portable.zip

