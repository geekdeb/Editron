name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri App & Publish Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Editron ${{ github.ref_name }}'
          releaseBody: |
            ## Editron Release ${{ github.ref_name }} ⚡
            
            Download the official Windows installer below to get started:
            - **`Editron_1.0.0_x64-setup.exe`** (Standard Windows NSIS Installer)
            
            ### Highlights
            - ⚡ Instant native desktop startup and ultra-low RAM footprint
            - 📁 Native File Explorer with persistent state across restarts
            - 🛠 Developer toolbox (JSON/XML/YAML formatters, Base64, URL, JWT, Hashes, RegEx, Timestamps, Unicode)
            - 📝 Live split Markdown preview
            - 🎨 Cyber Dark & Frost Light themes
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
